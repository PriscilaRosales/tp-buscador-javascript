<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscador con MockAPI TP javascript</title>

  <!-- Bulma (estable, reciente) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <!-- Font Awesome (para íconos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar is-primary" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item" href="#"><strong>Módulo Javascript</strong></a>
      <a role="button" class="navbar-burger" data-target="navMenu" aria-label="menu" aria-expanded="false">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navMenu" class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item">Inicio</a>
        <a class="navbar-item">Acerca</a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item">
          <button id="btn-add" class="button is-link">
            <span class="icon"><i class="fas fa-plus"></i></span>
            <span>Agregar Cliente</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h1 class="title">Gestión de Clientes</h1>

      <!-- Barra de filtros -->
      <div class="box mt-4">
        <div class="field is-grouped is-grouped-multiline">
          <!-- Buscar por nombre -->
          <div class="control">
            <input id="search-name" class="input" type="text" placeholder="Buscar por nombre" />
          </div>

          <!-- Filtro por País -->
          <div class="control">
            <div class="select">
              <select id="filter-country">
                <option value="">Todos los países</option>
              </select>
            </div>
          </div>

          <!-- Filtro por Puesto -->
          <div class="control">
            <div class="select">
              <select id="filter-job">
                <option value="">Todos los puestos</option>
              </select>
            </div>
          </div>

          <!-- Botón Limpiar -->
          <div class="control">
            <button id="btn-clear" class="button is-light">
              <span class="icon"><i class="fas fa-eraser"></i></span>
              <span>Limpiar filtros</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Estados -->
      <div id="status" class="notification is-hidden"></div>

      <div id="loader" class="has-text-centered is-hidden">
        <button class="button is-white is-loading">Cargando…</button>
      </div>

      <!-- Grid -->
      <div id="grid" class="columns is-multiline"></div>
    </div>
  </section>

  <script src="app.js" defer></script>

  <!-- Modal de confirmación (Bulma) -->
<div id="confirm-modal" class="modal" aria-modal="true" role="dialog">
  <div class="modal-background"></div>

  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Confirmar eliminación</p>
      <button id="confirm-close" class="delete" aria-label="close"></button>
    </header>

    <section class="modal-card-body">
      <div class="content has-text-centered">
        <p class="mb-2">
          ¿Estás seguro que deseas eliminar a <strong id="confirm-name">este perfil</strong>?
        </p>
        <p class="is-size-7 has-text-grey">Esta acción no se puede deshacer.</p>
      </div>
    </section>

    <footer class="modal-card-foot is-justify-content-center">
      <button id="btn-cancel-delete" class="button">Cancelar</button>
      <button id="btn-confirm-delete" class="button is-danger">
        <span class="icon"><i class="fas fa-trash"></i></span>
        <span>Eliminar</span>
      </button>
    </footer>
  </div>
</div>
</body>
</html>
